name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Installs the SDK command-line tools, accepts licenses, and puts the
      # compileSdk 37.2 platform in place; AGP downloads the matching
      # build-tools itself (licenses are accepted by this step).
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.2'

      - uses: gradle/actions/setup-gradle@v4

      # No keystore is configured here, so the release build is debug-signed:
      # enough to prove R8/shrinking works. Releases are built by release.yml.
      - name: Build and test
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:assembleRelease --stacktrace

      - name: Upload unit-test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: android/app/build/reports/tests/
          if-no-files-found: ignore

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/backend/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm test
